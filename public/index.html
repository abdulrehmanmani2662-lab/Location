<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Share Your Location</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
    }

    .card {
      width: 92%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 8px 0 12px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      color: #555;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f4f7;
      text-align: left;
    }

    .row {
      margin: 8px 0;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">📍</div>

    <h1>Share Your Location</h1>

    <p>
      By pressing the button below, you can choose to share
      your current location with this website.
      Chrome will ask you for permission before sharing it.
    </p>

    <button id="shareButton">
      Share My Location
    </button>

    <div id="status"></div>

    <div id="result">

      <div class="row">
        <span class="label">Latitude:</span>
        <span id="latitude"></span>
      </div>

      <div class="row">
        <span class="label">Longitude:</span>
        <span id="longitude"></span>
      </div>

      <div class="row">
        <span class="label">Accuracy:</span>
        <span id="accuracy"></span> meters
      </div>

    </div>

  </div>

<script>
const shareButton =
  document.getElementById("shareButton");

const statusBox =
  document.getElementById("status");

const result =
  document.getElementById("result");

shareButton.addEventListener("click", () => {

  if (!navigator.geolocation) {
    statusBox.textContent =
      "Geolocation is not supported by this browser.";
    return;
  }

  shareButton.disabled = true;

  statusBox.textContent =
    "Waiting for Chrome location permission...";

  navigator.geolocation.getCurrentPosition(

    async (position) => {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      document.getElementById("latitude").textContent =
        latitude.toFixed(6);

      document.getElementById("longitude").textContent =
        longitude.toFixed(6);

      document.getElementById("accuracy").textContent =
        Math.round(accuracy);

      result.style.display = "block";

      statusBox.textContent =
        "Location received. Sending...";

      try {

        const response = await fetch(
          "/api/location",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              latitude: latitude,
              longitude: longitude,
              accuracy: accuracy,
              consent: true
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed"
          );
        }

        statusBox.textContent =
          "Location shared successfully.";

      } catch (error) {

        console.error(error);

        statusBox.textContent =
          "Location was obtained, but sending failed.";
      }

      shareButton.disabled = false;
    },

    (error) => {

      shareButton.disabled = false;

      switch (error.code) {

        case 1:
          statusBox.textContent =
            "Location permission was denied.";
          break;

        case 2:
          statusBox.textContent =
            "Location could not be determined.";
          break;

        case 3:
          statusBox.textContent =
            "Location request timed out.";
          break;

        default:
          statusBox.textContent =
            "Unable to obtain location.";
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});
</script>

</body>
</html>
