<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Location Portal</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial,sans-serif;
 color:white;
 background:#020306;
 overflow:hidden;
}

body:before{
 content:"";
 position:fixed;
 width:700px;
 height:700px;
 background:radial-gradient(circle,#00e5ff22,transparent 65%);
 animation:move 8s infinite alternate;
}

@keyframes move{
 from{transform:translate(-25%,-20%)}
 to{transform:translate(25%,20%)}
}

.card{
 position:relative;
 width:92%;
 max-width:430px;
 padding:35px 25px;
 text-align:center;
 border:1px solid #ffffff20;
 border-radius:28px;
 background:#080b11e8;
 box-shadow:0 0 60px #00d9ff18;
 backdrop-filter:blur(20px);
}

.logo{
 width:105px;
 height:105px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 font-size:48px;
 background:#06141b;
 border:1px solid #00d9ff66;
 box-shadow:0 0 30px #00d9ff55;
}

h1{
 margin:22px 0 8px;
 letter-spacing:2px;
 font-size:25px;
}

p{
 color:#9ca7b4;
 line-height:1.5;
 font-size:14px;
}

button{
 width:100%;
 padding:17px;
 margin-top:20px;
 border:0;
 border-radius:15px;
 color:white;
 background:linear-gradient(100deg,#00a8ff,#762cff);
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 opacity:.55;
 cursor:not-allowed;
}

#status{
 display:none;
 margin-top:20px;
 padding:15px;
 border-radius:14px;
 background:#ffffff09;
 color:#b9c3cf;
 font-size:13px;
 line-height:1.5;
}

.small{
 margin-top:18px;
 color:#596572;
 font-size:11px;
}
</style>
</head>

<body>

<div class="card">

 <div class="logo">📍</div>

 <h1>LOCATION PORTAL</h1>

 <p>
   Share your current location with the site owner.
   Your browser will ask for permission before sharing.
 </p>

 <button id="btn" onclick="getLocation()">
   SHARE MY LOCATION
 </button>

 <div id="status"></div>

 <div class="small">
   🔒 Location is shared only after your permission.
 </div>

</div>

<script>

const btn = document.getElementById("btn");
const statusBox = document.getElementById("status");

function status(message){
    statusBox.style.display = "block";
    statusBox.innerHTML = message;
}

function getLocation(){

    if(!navigator.geolocation){
        status("❌ Your browser does not support location.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "GETTING LOCATION...";

    status("📡 Requesting your location...");

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            status(
                "📍 Location received<br><br>" +
                "Accuracy: " +
                Math.round(accuracy) +
                " meters<br><br>" +
                "Sending notification..."
            );

            try{

                const response = await fetch("/api/location",{
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        latitude: latitude,
                        longitude: longitude,
                        accuracy: accuracy,
                        consent: true
                    })
                });

                const result = await response.json();

                console.log(result);

                if(result.ok){

                    status(
                        "✅ LOCATION SENT<br><br>" +
                        "Telegram notification sent successfully."
                    );

                    btn.innerText = "LOCATION SHARED ✓";

                }else{

                    status(
                        "⚠️ Location received.<br><br>" +
                        "Telegram error: " +
                        (result.error || "Unknown error")
                    );

                    btn.disabled = false;
                    btn.innerText = "TRY AGAIN";
                }

            }catch(error){

                console.error(error);

                status(
                    "❌ Server connection failed.<br><br>" +
                    "Please try again."
                );

                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
            }
        },

        function(error){

            btn.disabled = false;
            btn.innerText = "SHARE MY LOCATION";

            if(error.code === 1){
                status("❌ Location permission was denied.");
            }
            else if(error.code === 2){
                status("❌ Location unavailable.");
            }
            else if(error.code === 3){
                status(
                    "❌ Location request timed out.<br><br>" +
                    "Please make sure Location/GPS is ON and try again."
                );
            }
            else{
                status("❌ Unable to get location.");
            }

        },

        {
            enableHighAccuracy:false,
            timeout:120000,
            maximumAge:60000
        }
    );
}

</script>

</body>
</html>
