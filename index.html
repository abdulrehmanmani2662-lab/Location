<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Punjab Blood Bank</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#05070a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#siteFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

#locationPanel{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(150%);
    width:calc(100% - 30px);
    max-width:430px;
    padding:24px;
    border-radius:24px;
    color:white;
    background:rgba(9,11,15,.97);
    border:1px solid #ffffff18;
    box-shadow:0 20px 70px #000,0 0 40px #d0000030;
    backdrop-filter:blur(20px);
    transition:.5s ease;
    z-index:10;
}

#locationPanel.show{
    transform:translateX(-50%) translateY(0);
}

.icon{
    width:55px;
    height:55px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:#d0000018;
    font-size:28px;
}

h2{
    margin:0 0 8px;
    font-size:22px;
}

p{
    margin:0;
    color:#a5adb7;
    font-size:13px;
    line-height:1.6;
}

button{
    width:100%;
    margin-top:18px;
    padding:16px;
    border:0;
    border-radius:14px;
    color:white;
    background:linear-gradient(135deg,#c40000,#ff3030);
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
}

#status{
    display:none;
    margin-top:13px;
    padding:12px;
    border-radius:12px;
    background:#ffffff08;
    color:#bfc6ce;
    font-size:12px;
    line-height:1.5;
}

.close{
    position:absolute;
    right:17px;
    top:14px;
    color:#737b85;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- APNI WEBSITE KA LINK YAHAN CHANGE KAREN -->
<iframe id="siteFrame"
    src="https://punjab-blood-bank.streamlit.app"
    allow="geolocation">
</iframe>

<div id="locationPanel">

    <div class="close" onclick="closePanel()">×</div>

    <div class="icon">📍</div>

    <h2>Share Your Location</h2>

    <p>
        Punjab Blood Bank needs your current location to provide
        location-based assistance. Your browser will ask for
        permission before sharing.
    </p>

    <button id="locationBtn" onclick="shareLocation()">
        📍 SHARE MY LOCATION
    </button>

    <div id="status"></div>

</div>

<script>

/* =========================================
   WEBSITE SETTING
   Change only this URL when needed.
   ========================================= */

const WEBSITE_URL =
    "https://punjab-blood-bank.streamlit.app";

document.getElementById("siteFrame").src = WEBSITE_URL;


/* =========================================
   SHOW LOCATION PANEL AFTER 7 SECONDS
   ========================================= */

setTimeout(function(){

    document
        .getElementById("locationPanel")
        .classList.add("show");

},7000);


/* =========================================
   CLOSE PANEL
   ========================================= */

function closePanel(){

    document
        .getElementById("locationPanel")
        .classList.remove("show");
}


/* =========================================
   LOCATION
   ========================================= */

async function shareLocation(){

    const btn = document.getElementById("locationBtn");
    const status = document.getElementById("status");

    if(!navigator.geolocation){

        status.style.display="block";
        status.innerHTML="❌ Your browser does not support location.";
        return;
    }

    btn.disabled=true;
    btn.innerText="📡 GETTING LOCATION...";

    status.style.display="block";
    status.innerHTML="Requesting location permission...";

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            status.innerHTML =
                "📍 Location received.<br>" +
                "Accuracy: " +
                Math.round(accuracy) +
                " meters<br><br>" +
                "Sending...";

            try{

                const response = await fetch(
                    "/api/location",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body:JSON.stringify({

                            latitude:latitude,

                            longitude:longitude,

                            accuracy:accuracy,

                            consent:true
                        })
                    }
                );

                const result =
                    await response.json();

                if(result.ok){

                    status.innerHTML =
                        "✅ Location shared successfully.";

                    btn.innerText =
                        "✓ LOCATION SHARED";

                }else{

                    status.innerHTML =
                        "⚠️ " +
                        (result.error ||
                        "Unable to send location.");

                    btn.disabled=false;
                    btn.innerText =
                        "📍 TRY AGAIN";
                }

            }catch(error){

                console.error(error);

                status.innerHTML =
                    "❌ Server connection failed.";

                btn.disabled=false;
                btn.innerText =
                    "📍 TRY AGAIN";
            }
        },

        function(error){

            btn.disabled=false;
            btn.innerText =
                "📍 SHARE MY LOCATION";

            status.style.display="block";

            if(error.code===1){

                status.innerHTML =
                    "❌ Location permission was denied.";

            }else if(error.code===2){

                status.innerHTML =
                    "❌ Location is unavailable.";

            }else if(error.code===3){

                status.innerHTML =
                    "❌ Location request timed out.";

            }else{

                status.innerHTML =
                    "❌ Unable to get location.";
            }
        },

        {
            enableHighAccuracy:true,
            timeout:20000,
            maximumAge:5000
        }
    );
}

</script>

</body>
</html>
